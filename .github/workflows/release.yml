name: Build and release Windows installer

# Triggered by pushing a tag like v1.0.1. The tag's version (after stripping
# the leading "v") must match both VERSION and installer/installer.iss's
# MyAppVersion — desktop_app.py's auto-updater compares its bundled VERSION
# against the latest release tag (see UPDATE_API_URL in desktop_app.py), so
# a mismatched tag would either publish a release the app never notices or
# one that claims a version the exe doesn't actually contain.
on:
  push:
    tags:
      - "v*.*.*"
  # Lets bump-version.yml (which commits/tags using the default GITHUB_TOKEN)
  # explicitly kick off a build. A tag pushed with GITHUB_TOKEN does NOT
  # trigger other workflows' `on: push: tags` events (GitHub's own loop-
  # prevention rule) — workflow_dispatch is the documented exception, so
  # bump-version.yml calls `gh workflow run release.yml` instead of relying
  # on its tag push to be picked up here.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to build and release (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pillow

      - name: Check tag matches VERSION and installer.iss
        shell: bash
        run: |
          tag_version="${{ inputs.tag_name || github.ref_name }}"
          tag_version="${tag_version#v}"
          file_version="$(cat VERSION | tr -d '[:space:]')"
          iss_version="$(grep -oP '(?<=#define MyAppVersion ")[^"]+' installer/installer.iss)"
          echo "tag=$tag_version VERSION=$file_version installer.iss=$iss_version"
          if [ "$tag_version" != "$file_version" ] || [ "$tag_version" != "$iss_version" ]; then
            echo "::error::Tag v$tag_version does not match VERSION ($file_version) and/or installer.iss MyAppVersion ($iss_version). Bump both files and re-tag."
            exit 1
          fi

      - name: Build app (PyInstaller --onedir)
        shell: cmd
        run: build_exe.bat

      - name: Build installer (Inno Setup)
        shell: cmd
        working-directory: installer
        run: build_installer.bat

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/DeltaDataValidation_Setup.exe
          generate_release_notes: true
