name: Bump version and release

# Manual trigger: run this instead of hand-editing VERSION and
# installer/installer.iss. It bumps both files together (they must stay in
# sync — see the comment at the top of installer.iss), commits the bump to
# main, tags it, and kicks off release.yml to build and publish the
# installer for the new tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          current="$(tr -d '[:space:]' < VERSION)"
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Update VERSION and installer.iss
        run: |
          printf '%s\n' "${{ steps.version.outputs.next }}" > VERSION
          sed -i \
            "s/#define MyAppVersion \"${{ steps.version.outputs.current }}\"/#define MyAppVersion \"${{ steps.version.outputs.next }}\"/" \
            installer/installer.iss

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION installer/installer.iss
          git commit -m "Bump version to ${{ steps.version.outputs.next }}"
          git tag "v${{ steps.version.outputs.next }}"
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.next }}"

      - name: Trigger release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --ref "v${{ steps.version.outputs.next }}" \
            -f tag_name="v${{ steps.version.outputs.next }}"
